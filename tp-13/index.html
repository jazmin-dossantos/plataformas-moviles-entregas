<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Compras - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>

<body>

    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">

        <h1>Lista de Compras</h1>

        <div class="card">
            <div class="card-body">

                <h2>Listado de Productos</h2>

                <ul id="lista-productos">
                    <li>
                        <span>Pan</span>
                        <button class="btn btn-danger btn-sm">Eliminar</button>
                    </li>
                </ul>

                <hr class="hr">

                <h2>Agregar Producto</h2>

                <form id="form-producto">

                    <div class="input-group mb-3">

                        <input type="text" class="form-control" aria-label="Nombre del Producto">

                        <button class="btn btn-primary" type="submit">
                            Agregar Producto
                        </button>

                    </div>

                </form>

                <hr class="hr">

                <button id="btn-limpiar" class="btn btn-danger">
                    Limpiar lista
                </button>

                <button id="btn-ordenar" class="btn btn-secondary">
                    Ordenar productos
                </button>

            </div>
        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

    <script type="text/javascript">

        /**
         * agregarProducto()
         * esta función se va a llamar cuando el usuario envía
         * el formulario con el nombre del producto para agregar.
         */
        function agregarProducto(nombreProducto) {

            const lista = document.querySelector('#lista-productos');

            const nuevoProducto = document.createElement('li');

            const textoProducto = document.createElement('span');

            textoProducto.innerText = nombreProducto;

            nuevoProducto.append(textoProducto);

            const botonEliminar = document.createElement('button');

            botonEliminar.innerText = "Eliminar";

            botonEliminar.addEventListener('click', function() {

                nuevoProducto.remove();

            });

            nuevoProducto.append(botonEliminar);

            lista.append(nuevoProducto);
        }


        function handlerFormulario(evento) {

            evento.preventDefault();

            const input = evento.target.querySelector('input');

            const nombreProducto = input.value;

            input.value = "";

            agregarProducto(nombreProducto);
        }


        document.querySelector('form').addEventListener('submit', handlerFormulario);


        // Eliminar el Pan que ya estaba en la lista

        const botonPan = document.querySelector('#lista-productos li button');

        botonPan.addEventListener('click', function() {

            const producto = document.querySelector('#lista-productos li');

            producto.remove();

        });


        // LIMPIAR LA LISTA

        const btnLimpiar = document.querySelector('#btn-limpiar');

        btnLimpiar.addEventListener('click', function() {

            const lista = document.querySelector('#lista-productos');

            lista.innerHTML = "";

        });


        // ORDENAR PRODUCTOS

        const btnOrdenar = document.querySelector('#btn-ordenar');

        btnOrdenar.addEventListener('click', function() {

            const lista = document.querySelector('#lista-productos');

            const productos = document.querySelectorAll('#lista-productos li');

            let productosTexto = [];

            productos.forEach(function(producto) {

                const nombre = producto.querySelector('span');

                productosTexto.push(nombre.innerText);

            });

            productosTexto.sort();

            lista.innerHTML = "";

            productosTexto.forEach(function(producto) {

                agregarProducto(producto);

            });

        });

    </script>

</body>
</html>
