<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Tablero de Puntos - DOM y JavaScript</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">

        <h1>Tablero de Puntos</h1>

        <div class="card">

            <div class="card-body">

                <div class="row text-center">

                    <div class="col-5">

                        <span id="puntosLocal" class="display-1">
                            0
                        </span>

                        <p class="m-0">
                            Local
                        </p>

                    </div>

                    <div class="col-2">

                        <span class="display-1">
                            :
                        </span>

                    </div>

                    <div class="col-5">

                        <span id="puntosVisitante" class="display-1">
                            0
                        </span>

                        <p class="m-0">
                            Visitante
                        </p>

                    </div>

                </div>

                <hr>

                <h2>Actualizar Contador</h2>

                <div class="row">

                    <div class="col-12 col-sm-3 my-1">

                        <button id="sumarLocal" class="btn d-block w-100 btn-primary">
                            + Punto Local
                        </button>

                    </div>

                    <div class="col-12 col-sm-3 my-1">

                        <button id="restarLocal" class="btn d-block w-100 btn-primary">
                            - Punto Local
                        </button>

                    </div>

                    <div class="col-12 col-sm-3 my-1">

                        <button id="sumarVisitante" class="btn d-block w-100 btn-primary">
                            + Punto Visitante
                        </button>

                    </div>

                    <div class="col-12 col-sm-3 my-1">

                        <button id="restarVisitante" class="btn d-block w-100 btn-primary">
                            - Punto Visitante
                        </button>

                    </div>

                </div>

                <hr>

                <div class="row">

                    <div class="col-12 col-sm-4 my-1">

                        <button id="invertir" class="btn d-block w-100 btn-warning">
                            Invertir Puntaje
                        </button>

                    </div>

                    <div class="col-12 col-sm-4 my-1">

                        <button id="finalizar" class="btn d-block w-100 btn-dark">
                            Finalizar Partido
                        </button>

                    </div>

                    <div class="col-12 col-sm-4 my-1">

                        <button id="reiniciar" class="btn d-block w-100 btn-danger">
                            Reinicio
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script>

        let puntosLocal = 0;
        let puntosVisitante = 0;

        let marcadorLocal = document.getElementById("puntosLocal");
        let marcadorVisitante = document.getElementById("puntosVisitante");

        let botonSumarLocal = document.getElementById("sumarLocal");
        let botonRestarLocal = document.getElementById("restarLocal");

        let botonSumarVisitante = document.getElementById("sumarVisitante");
        let botonRestarVisitante = document.getElementById("restarVisitante");

        let botonInvertir = document.getElementById("invertir");
        let botonFinalizar = document.getElementById("finalizar");
        let botonReiniciar = document.getElementById("reiniciar");


        function actualizarMarcador() {
            marcadorLocal.textContent = puntosLocal;
            marcadorVisitante.textContent = puntosVisitante;
        }


        botonSumarLocal.addEventListener("click", function() {
            puntosLocal++;
            actualizarMarcador();
        });


        botonRestarLocal.addEventListener("click", function() {
            if (puntosLocal > 0) {
                puntosLocal--;
                actualizarMarcador();
            }
        });


        botonSumarVisitante.addEventListener("click", function() {
            puntosVisitante++;
            actualizarMarcador();
        });


        botonRestarVisitante.addEventListener("click", function() {
            if (puntosVisitante > 0) {
                puntosVisitante--;
                actualizarMarcador();
            }
        });


        botonInvertir.addEventListener("click", function() {
            let puntajeTemporal = puntosLocal;

            puntosLocal = puntosVisitante;
            puntosVisitante = puntajeTemporal;

            actualizarMarcador();
        });


        botonFinalizar.addEventListener("click", function() {
            botonSumarLocal.disabled = true;
            botonRestarLocal.disabled = true;

            botonSumarVisitante.disabled = true;
            botonRestarVisitante.disabled = true;
        });


        botonReiniciar.addEventListener("click", function() {
            puntosLocal = 0;
            puntosVisitante = 0;

            actualizarMarcador();

            botonSumarLocal.disabled = false;
            botonRestarLocal.disabled = false;

            botonSumarVisitante.disabled = false;
            botonRestarVisitante.disabled = false;
        });

    </script>

</body>
</html>
