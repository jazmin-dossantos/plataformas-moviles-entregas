<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokéDex - TP 16</title>
 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
 
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

  <div class="container py-4">
    <header class="text-center mb-4">
      <h1 class="display-4 text-danger fw-bold">Pokemonessss</h1>
      <p class="lead">Aplicación interactiva conectada a Poké</p>
    </header>

   
    <div id="pokemon-container" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4"></div>

   
    <div id="loading-spinner" class="text-center my-4 d-none">
      <div class="spinner-border text-danger" role="status" style="width: 3rem; height: 3rem;">
        <span class="visually-hidden">Cargando...</span>
      </div>
    </div>

  
    <div class="text-center my-4">
      <button id="btn-load-more" class="btn btn-danger btn-lg">Cargar más Pokémon</button>
    </div>
  </div>


  <div class="modal fade" id="pokemonModal" tabindex="-1" aria-labelledby="pokemonModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title text-capitalize fs-3 fw-bold" id="pokemonModalLabel">Detalles</h5>
          <button type="button" class="btn-close" id="btn-close-modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center" id="modal-body-content">
         
        </div>
      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script src="app.js"></script>
</body>
</html>
