<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Contactos - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>

<body>

    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">

        <h1>Lista de Contactos</h1>

        <div class="card">
            <div class="card-body">

                <h2>Contactos</h2>

                <ul id="lista-contactos"></ul>

                <hr class="hr">

                <h2>Nuevo Contacto</h2>

                <form id="form-producto">

                    <div class="input-group mb-3">

                        <input type="text"
                            class="form-control"
                            name="nombre"
                            id="input-nombre"
                            placeholder="Nombre"
                            aria-label="Nombre">

                        <input type="text"
                            class="form-control"
                            name="apellido"
                            id="input-apellido"
                            placeholder="Apellido"
                            aria-label="Apellido">

                        <input type="text"
                            class="form-control"
                            name="telefono"
                            id="input-telefono"
                            placeholder="Teléfono"
                            aria-label="Teléfono">

                    </div>

                    <button class="btn btn-primary" type="submit">
                        Agregar Contacto
                    </button>

                </form>

                <hr class="hr">

                <h2>Ordenar</h2>

                <button id="btn-nombre" class="btn btn-secondary">
                    Ordenar por nombre
                </button>

                <button id="btn-apellido" class="btn btn-secondary">
                    Ordenar por apellido
                </button>

                <button id="btn-favoritos" class="btn btn-warning">
                    Ver favoritos
                </button>

                <button id="btn-todos" class="btn btn-primary">
                    Ver todos
                </button>

            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>


    <script type="text/javascript">

        let contactos = [
            {
                nombre: 'Juan',
                apellido: 'Perez',
                telefono: '123456789',
                favorito: false,
            },
        ];


        /**
         * agregarContacto()
         * Esta función agrega un nuevo contacto al array.
         */
        function agregarContacto(nombre, apellido, telefono) {

            const nuevoContacto = {

                nombre: nombre,
                apellido: apellido,
                telefono: telefono,
                favorito: false

            };

            contactos.push(nuevoContacto);

            mostrarListado();
        }


        /**
         * mostrarListado()
         * Esta función muestra en el DOM todos los contactos.
         */
        function mostrarListado() {

            const lista = document.querySelector('#lista-contactos');

            lista.innerHTML = "";

            contactos.forEach(function(contacto) {

                const elemento = document.createElement('li');

                elemento.innerText =
                    contacto.nombre + " " +
                    contacto.apellido + " - " +
                    contacto.telefono;

                const botonFavorito = document.createElement('button');

                if (contacto.favorito == true) {

                    botonFavorito.innerText = "Quitar favorito";

                } else {

                    botonFavorito.innerText = "Favorito";

                }


                botonFavorito.addEventListener('click', function() {

                    if (contacto.favorito == true) {

                        contacto.favorito = false;

                    } else {

                        contacto.favorito = true;

                    }

                    mostrarListado();

                });


                elemento.append(botonFavorito);

                lista.append(elemento);

            });
        }


        function handlerFormulario(e) {

            e.preventDefault();

            const inputNombre = e.target.querySelector('#input-nombre');
            const inputApellido = e.target.querySelector('#input-apellido');
            const inputTelefono = e.target.querySelector('#input-telefono');

            const nombre = inputNombre.value;
            const apellido = inputApellido.value;
            const telefono = inputTelefono.value;

            inputNombre.value = "";
            inputApellido.value = "";
            inputTelefono.value = "";

            agregarContacto(nombre, apellido, telefono);
        }


        document.querySelector('form').addEventListener('submit', handlerFormulario);


        // Ordenar solo por nombre
     

        const btnNombre = document.querySelector('#btn-nombre');

        btnNombre.addEventListener('click', function() {

            contactos.sort(function(a, b) {

                return a.nombre.localeCompare(b.nombre);

            });

            mostrarListado();

        });


      
        // Ordenar solo por apellido

        const btnApellido = document.querySelector('#btn-apellido');

        btnApellido.addEventListener('click', function() {

            contactos.sort(function(a, b) {

                return a.apellido.localeCompare(b.apellido);

            });

            mostrarListado();

        });


    
        // Mostrar solo favoritos
     
        const btnFavoritos = document.querySelector('#btn-favoritos');
        btnFavoritos.addEventListener('click', function() {
            const lista = document.querySelector('#lista-contactos');

            lista.innerHTML = "";

            contactos.forEach(function(contacto) {

                if (contacto.favorito == true) {
                    const elemento = document.createElement('li');

                    elemento.innerText =
                        contacto.nombre + " " +
                        contacto.apellido + " - " +
                        contacto.telefono;

                    lista.append(elemento);

                }

            });

        });

        // Mostrar todo
       
        const btnTodos = document.querySelector('#btn-todos');

        btnTodos.addEventListener('click', function() {
            mostrarListado();

        });


        // Mostrar el contacto inicial
        mostrarListado();

    </script>

</body>
</html>
